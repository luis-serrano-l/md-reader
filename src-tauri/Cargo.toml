[package]
name = "md-reader"
version = "0.1.0"
license = "MIT"
description = "Read Markdown notes with the study-PDF look, from folders you choose"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "md_reader_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
percent-encoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
